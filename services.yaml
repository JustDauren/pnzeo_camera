ptz_control:
  name: PTZ Control
  description: Control camera pan/tilt/zoom
  fields:
    direction:
      name: Direction
      description: Movement direction
      required: true
      selector:
        select:
          options:
            - up
            - down
            - left
            - right
            - center
            - zoom_in
            - zoom_out
    step:
      name: Step mode
      description: 0 = continuous, 1 = one step
      default: 1
      selector:
        number:
          min: 0
          max: 1

goto_preset:
  name: Go to Preset
  description: Move camera to a saved preset position
  fields:
    preset:
      name: Preset number
      description: Preset position (0-15)
      required: true
      selector:
        number:
          min: 0
          max: 15

set_preset:
  name: Save Preset
  description: Save current camera position as preset
  fields:
    preset:
      name: Preset number
      description: Preset slot to save to (0-15)
      required: true
      selector:
        number:
          min: 0
          max: 15

send_command:
  name: Send Command
  description: Send camera control command (advanced)
  fields:
    msg_type:
      name: Command type
      description: Camera control command ID (0-255)
      required: true
      selector:
        number:
          min: 0
          max: 255

change_password:
  name: Change Camera Password
  description: Change the camera login password
  fields:
    new_password:
      name: New password
      description: New password for the camera
      required: true
      selector:
        text:

get_alarm_log:
  name: Get Alarm Log
  description: Retrieve alarm log entries from camera

sync_time:
  name: Sync Time
  description: Synchronize camera time with Home Assistant system time

start_recording:
  name: Start Recording
  description: Trigger manual recording on camera SD card

wifi_scan:
  name: WiFi Scan
  description: Scan for available WiFi networks from camera

wifi_connect:
  name: WiFi Connect
  description: Connect camera to a WiFi network
  fields:
    ssid:
      name: SSID
      description: WiFi network name
      required: true
      selector:
        text:
    password:
      name: Password
      description: WiFi password
      required: true
      selector:
        text:
    security:
      name: Security
      description: "Security type: 0=None, 1=WEP, 2=WPA, 3=WPA2"
      default: 3
      selector:
        number:
          min: 0
          max: 3

set_ddns:
  name: Set DDNS
  description: Configure dynamic DNS settings
  fields:
    service:
      name: DDNS Service
      description: DDNS provider name
      required: true
      selector:
        text:
    hostname:
      name: Hostname
      description: DDNS hostname
      required: true
      selector:
        text:
    user:
      name: Username
      description: DDNS account username
      required: true
      selector:
        text:
    password:
      name: Password
      description: DDNS account password
      required: true
      selector:
        text:
    port:
      name: Port
      description: DDNS port
      default: 80
      selector:
        number:
          min: 1
          max: 65535

get_users:
  name: Get Users
  description: List camera user accounts (3 slots)

manage_users:
  name: Manage Users
  description: Set camera user accounts (all 3 slots, empty = remove)
  fields:
    user1:
      name: User 1 Name
      description: Primary user (admin)
      selector:
        text:
    pwd1:
      name: User 1 Password
      description: Primary user password
      selector:
        text:
    user2:
      name: User 2 Name
      description: Secondary user
      selector:
        text:
    pwd2:
      name: User 2 Password
      description: Secondary user password
      selector:
        text:
    user3:
      name: User 3 Name
      description: Third user
      selector:
        text:
    pwd3:
      name: User 3 Password
      description: Third user password
      selector:
        text:

set_ftp:
  name: Configure FTP Upload
  description: Set FTP server for alarm snapshot/recording uploads
  fields:
    server:
      name: FTP Server
      description: FTP server hostname or IP
      required: true
      selector:
        text:
    port:
      name: Port
      description: FTP port
      default: 21
      selector:
        number:
          min: 1
          max: 65535
    user:
      name: Username
      description: FTP username
      selector:
        text:
    password:
      name: Password
      description: FTP password
      selector:
        text:
    directory:
      name: Directory
      description: Upload directory path
      default: "/"
      selector:
        text:
    mode:
      name: Transfer Mode
      description: "0 = Active (PORT), 1 = Passive (PASV)"
      default: 1
      selector:
        number:
          min: 0
          max: 1
    upload_interval:
      name: Upload Interval
      description: "Seconds between uploads (0 = every alarm)"
      default: 0
      selector:
        number:
          min: 0
          max: 3600

set_email:
  name: Configure Email Notifications
  description: Set SMTP server for alarm email notifications
  fields:
    smtp_server:
      name: SMTP Server
      description: SMTP server hostname
      required: true
      selector:
        text:
    smtp_port:
      name: SMTP Port
      description: SMTP port (587 for TLS)
      default: 587
      selector:
        number:
          min: 1
          max: 65535
    user:
      name: Username
      description: SMTP username
      selector:
        text:
    password:
      name: Password
      description: SMTP password
      selector:
        text:
    sender:
      name: Sender Email
      description: From email address
      selector:
        text:
    receiver:
      name: Receiver Email
      description: Recipient email address
      required: true
      selector:
        text:
    ssl:
      name: SSL/TLS
      description: "0 = off, 1 = TLS/STARTTLS"
      default: 1
      selector:
        number:
          min: 0
          max: 1

set_push_token:
  name: Set Push Token
  description: Register FCM push notification token for alarm alerts
  fields:
    token:
      name: FCM Token
      description: Firebase Cloud Messaging token
      required: true
      selector:
        text:

get_ftp_settings:
  name: Get FTP Settings
  description: Retrieve current FTP upload configuration from camera (fires pnzeo_camera_ftp_settings event)

get_email_settings:
  name: Get Email Settings
  description: Retrieve current email notification configuration from camera (fires pnzeo_camera_email_settings event)
